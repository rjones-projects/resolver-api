name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: idp-poc-495014
  REGION: europe-west2
  REGISTRY: europe-west2-docker.pkg.dev
  REPOSITORY: resolver-api
  SERVICE: resolver-api
  IMAGE: europe-west2-docker.pkg.dev/idp-poc-495014/resolver-api/resolver-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation

    steps:
      - name: Output Run ID
        run: echo ${{ github.run_id }}
      - name: Output Run Number
        run: echo ${{ github.run_number }}
      - name: Output Run Attempt
        run: echo ${{ github.run_attempt }}      
      - name: Checkout
        uses: actions/checkout@v4

      - name: GCP Auth
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Build and push image
        uses: ./.github/actions/build-push-image
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}
          build_args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Cloud Run
        uses: ./.github/actions/deploy-cloud-run
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated
